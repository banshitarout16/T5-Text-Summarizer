<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f7e5e5;
        color: #222;
    }

    .container {
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background: #fff;
        border: 1px ;
        border-radius: 20px;
        box-shadow: 0 8px 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
        text-align: center;
        color: #6b0909b8;
    }
    
    h5 {
        text-align: center;
        margin-bottom: 30px;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    textarea {
        height: 150px;
        padding: 10px;
        border: 1px solid #b50000;
        border-radius: 5px;
        font-size: 16px;
    }

    button {
        background-color: #b50000;
        color: white;
        border: none;
        padding: 10px 15px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 5px;
    }

    button:hover {
        background-color: #8f0000;
    }

    #summary-output {
        margin-top: 20px;
        background: #f1e3e3;
        padding: 15px;
        border: 1px solid #b50000;
        border-radius: 5px;
    }

    #summary-heading {
        color: #6b0909b8;
        margin-top: 0;
        opacity: 1;
    }

    h3 {
    text-align: center;
    margin-top: 50px;
    margin-bottom: 30px;
    color: #6b0909b8;
    opacity: 0.7;
    }

</style>
</head>
<body>
    <div class="container">
        <h1>Text Summarizer</h1>
        <h5>Enter your content below for quick summarization.</h5>

        <form id="summarization-form">
            <textarea id="dialogue-input" placeholder="Enter your content here..." required></textarea>
            <button type="submit">Summarize</button>
        </form>

        <div id="summary-output">
            <h3 id="summary-heading">Content Summary</h3>
            <p id="summary-text"></p>
        </div>
        <h3> HuggingFace Transformer</h3>
    </div>

    <script>
        document.getElementById("summarization-form").addEventListener("submit", async (e) => {
            e.preventDefault();
        
            const dialogueInput = document.getElementById("dialogue-input");
            const summaryText = document.getElementById("summary-text");
            const submitButton = e.target.querySelector("button");
        
            const dialogue = dialogueInput.value.trim();
            if (!dialogue) return;
        
            summaryText.innerText = "Processing...please wait!";
            submitButton.disabled = true;
        
            try {
                const response = await fetch("/summarize/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ dialogue }),
                });
        
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
        
                const data = await response.json();
                summaryText.innerText = data.summary || "No summary returned.";
            } catch (err) {
                
                summaryText.innerText = `Error: ${err.message}`;
            } finally {
                
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
